[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rnn-lyapunov"
version = "0.1.0"
description = "Full Lyapunov spectra of chaotic recurrent neural networks"
readme = "README.md"
license = "MIT"
authors = [{ name = "Valerie Fong" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "nbconvert", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
include = ["rnn_lyapunov*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than about 10 seconds (CI skips these)"]
